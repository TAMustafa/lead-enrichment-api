[project]
name = "lead-qualification-api"
version = "0.1.0"
description = "Deterministic, auditable lead qualification modular monolith"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "asyncpg>=0.30,<1",
  "google-auth>=2.38,<3", "requests>=2.32,<3", "phonenumbers>=8.13,<10",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
[dependency-groups]
dev = ["pgserver>=0.1.4,<0.2", "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/lead_api"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "live: opt-in writes to the named Salesforce development org"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
